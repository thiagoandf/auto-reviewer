<!DOCTYPE html>
<html>
  <head>
    <title>Auto-Reviewers</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        width: 260px;
        padding: 16px;
      }
      textarea {
        height: 100px;
      }
    </style>
  </head>
  <body>
    <label class="form-label" for="usernames">Reviewers</label>
    <p>One GitHub username per line</p>
    <textarea id="usernames" placeholder="username1&#10;username2" spellcheck="false"></textarea>
    <label class="checkbox-row">
      <input type="checkbox" id="hubspot-suffix" />
      Append <code>_hubspot</code> on github.com
    </label>
    <button class="btn" id="save">Save</button>
    <div id="message" class="message"></div>
    <div id="shortcut-hint" class="shortcut-hint"></div>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
