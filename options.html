<!DOCTYPE html>
<html>
  <head>
    <title>Auto-Reviewers — Settings</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        max-width: 480px;
        margin: 40px auto;
        padding: 0 24px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 4px;
      }
      .subtitle {
        color: var(--color-fg-muted);
        font-size: 14px;
        margin: 0 0 24px 0;
      }
      textarea {
        height: 160px;
      }
      .btn {
        width: auto;
        padding: 6px 24px;
      }
      .message {
        text-align: left;
        display: inline-block;
        margin-left: 12px;
      }
      .actions {
        display: flex;
        align-items: center;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Auto-Reviewers</h1>
    <p class="subtitle">Configure the reviewers to add to your GitHub PRs.</p>

    <label class="form-label" for="usernames">Usernames</label>
    <p>One GitHub username per line</p>
    <textarea id="usernames" placeholder="username1&#10;username2" spellcheck="false"></textarea>

    <label class="checkbox-row">
      <input type="checkbox" id="hubspot-suffix" />
      Append <code>_hubspot</code> suffix to usernames on github.com
    </label>

    <div class="actions">
      <button class="btn" id="save">Save settings</button>
      <span id="message" class="message"></span>
    </div>

    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
